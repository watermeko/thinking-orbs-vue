<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>thinking-orbs-vue — live demo</title>
    <meta
      name="description"
      content="Nine hand-tuned dotted thought-orb loading states for AI & agent UIs. Vue 3 port of thinking-orbs, rendered on a plain 2D canvas."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%23f3f5f8'%3E%3Ccircle cx='16' cy='16' r='2.6'/%3E%3Ccircle cx='16' cy='5' r='1.5'/%3E%3Ccircle cx='16' cy='27' r='1.5'/%3E%3Ccircle cx='5' cy='16' r='1.5'/%3E%3Ccircle cx='27' cy='16' r='1.5'/%3E%3Ccircle cx='8.2' cy='8.2' r='1.2'/%3E%3Ccircle cx='23.8' cy='23.8' r='1.2'/%3E%3Ccircle cx='23.8' cy='8.2' r='1.2'/%3E%3Ccircle cx='8.2' cy='23.8' r='1.2'/%3E%3C/g%3E%3C/svg%3E" />
    <script>
      // Resolve the demo theme before first paint: `?theme=dark|light` pins it,
      // otherwise the CSS falls back to prefers-color-scheme and the orbs'
      // `theme="auto"` does the same.
      (function () {
        var q = new URLSearchParams(location.search).get('theme');
        if (q !== 'dark' && q !== 'light') return;
        var root = document.documentElement;
        root.setAttribute('data-theme', q);
        root.classList.add(q);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
